<!DOCTYPE html>
<html>
<head>
    <title>Contact Me</title>
    <style>
        /* Body */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* Navbar */
        .navbar {
            position: sticky;
            top: 0;
            width: 100%;
            background: linear-gradient(90deg, rgb(3, 156, 167), rgb(0, 110, 120));
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        /* Logo */
        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Nav Links */
        .nav-links {
            display: flex;
            gap: 20px;
        }

        /* Links */
        .nav-links a {
            text-decoration: none;
            color: white;
            font-weight: bold;
            padding: 10px 18px;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        /* Hover Effect */
        .nav-links a:hover {
            background-color: white;
            color: rgb(3, 156, 167);
            transform: translateY(-2px);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                padding: 20px;
            }

            .nav-links {
                flex-direction: column;
                width: 100%;
                margin-top: 15px;
            }

            .nav-links a {
                text-align: center;
                width: 100%;
            }
        }
        img {
            width: 250px;
            border-radius: 70%;
        }
        .container {
            padding: 20px;
            background-color: white;
            max-width: 600px;
            margin: 20px auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 5px;
        }
        .contact {
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .text {
            color: #555;
            text-align: left;
            margin: 10px 0;
        }
        form {
            text-align: left;
            margin: 20px auto;
            max-width: 500px;
        }
        input[type="text"],
        input[type="email"],
        textarea,
        select {
            width: 100%;
            padding: 8px;
            margin: 5px 0 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea {
            height: 100px;
        }
        input[type="submit"] {
            background-color: rgb(3, 156, 167);
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        input[type="submit"]:hover {
            background-color: #00a3b3;
        }
        .checkbox-group, .radio-group {
            margin: 10px 0 15px;
        }
        .checkbox-group label, .radio-group label {
            display: block;
            margin: 5px 0;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo">My Portfolio</div>
    <div class="nav-links">
        <a href="education.html" target="_blank">Home</a>
        <a href="education.html" target="_blank">Education</a>
        <a href="experience.html" target="_blank">Experience</a>
        <a href="hobbies.html" target="_blank">Hobbies</a>
        <a href="project.html" target="_blank">Projects</a>
        <a href="contact.html" target="_blank">Contact Me</a>
    </div>
</nav>

<div class="container">
    <div class="contact">
        <h1>Contact Me</h1>
        <p class="text">Email: sp26bsse0025@maju.edu.pk</p>
        <p class="text">Phone: +92 342 76565655</p>

        <form id="contactForm" action="https://formsubmit.co/robinseo82@gmail.com" method="POST">
            
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_subject" value="New Portfolio Contact Submission!">
            <input type="hidden" name="_template" value="table">

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>


            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <input type="submit" id="submitBtn" value="Send">
        </form>
    </div>
</div>

</footer>

</body>
</html>
